<!doctype html>
<html lang="en" data-tm-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>The Mechanics — Design System Playground</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='1' y='1' width='14' height='14' fill='%2344622a' stroke='%232b312a' stroke-width='2'/%3E%3C/svg%3E" />
    <script>
      // Apply the theme before first paint to avoid a flash (URL > storage > light).
      (function () {
        var ok = { light: 1, dark: 1, coffee: 1 };
        var t = new URLSearchParams(location.search).get("theme");
        if (!ok[t]) { try { t = localStorage.getItem("tm-theme"); } catch (e) {} }
        if (!ok[t]) t = "light";
        document.documentElement.setAttribute("data-tm-theme", t);
      })();
    </script>
  </head>
  <body class="tm-root">
    <div id="app"></div>
    <script type="module" src="/src/playground/main.js"></script>
  </body>
</html>
